<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
    <marker id="arrblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e6f95"/>
    </marker>
  </defs>

  <!-- residual stream lines (drawn first, bands overlay them) -->
  <g stroke="#bbbbbb" stroke-width="1.5">
    <line x1="90"  y1="476" x2="90"  y2="168"/>
    <line x1="155" y1="476" x2="155" y2="168"/>
    <line x1="220" y1="476" x2="220" y2="168"/>
    <line x1="285" y1="476" x2="285" y2="168"/>
    <line x1="350" y1="476" x2="350" y2="168"/>
  </g>
  <line x1="415" y1="476" x2="415" y2="168" stroke="#2e6f95" stroke-width="2.5"/>
  <g stroke="#bbbbbb" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="90"  y1="176" x2="90"  y2="150"/>
    <line x1="155" y1="176" x2="155" y2="150"/>
    <line x1="220" y1="176" x2="220" y2="150"/>
    <line x1="285" y1="176" x2="285" y2="150"/>
    <line x1="350" y1="176" x2="350" y2="150"/>
  </g>
  <line x1="415" y1="176" x2="415" y2="150" stroke="#2e6f95" stroke-width="2.5" marker-end="url(#arrblue)"/>

  <!-- embedding band -->
  <rect x="60" y="430" width="420" height="30" rx="6" fill="#f4f4f4" stroke="#888888"/>
  <text x="270" y="449" text-anchor="middle" font-size="13" fill="#333333">token embeddings</text>

  <!-- transformer bands -->
  <rect x="60" y="370" width="420" height="30" rx="6" fill="#f4f4f4" stroke="#888888"/>
  <text x="270" y="389" text-anchor="middle" font-size="13" fill="#333333">transformer block 1</text>

  <circle cx="270" cy="340" r="1.6" fill="#666666"/>
  <circle cx="270" cy="347" r="1.6" fill="#666666"/>
  <circle cx="270" cy="354" r="1.6" fill="#666666"/>

  <rect x="60" y="280" width="420" height="30" rx="6" fill="#eef4f8" stroke="#2e6f95" stroke-width="1.5"/>
  <text x="270" y="299" text-anchor="middle" font-size="13" fill="#2e6f95">transformer block &#8467;</text>

  <circle cx="270" cy="250" r="1.6" fill="#666666"/>
  <circle cx="270" cy="257" r="1.6" fill="#666666"/>
  <circle cx="270" cy="264" r="1.6" fill="#666666"/>

  <rect x="60" y="190" width="420" height="30" rx="6" fill="#f4f4f4" stroke="#888888"/>
  <text x="270" y="209" text-anchor="middle" font-size="13" fill="#333333">transformer block 32</text>

  <text x="270" y="138" text-anchor="middle" font-size="12" fill="#999999">next-token prediction (training objective, unused here)</text>

  <!-- token boxes -->
  <g font-size="13">
    <rect x="61"  y="478" width="58" height="26" rx="5" fill="#fafafa" stroke="#999999"/>
    <text x="90"  y="495" text-anchor="middle" fill="#777777" font-size="11">&#9001;bos&#9002;</text>
    <rect x="126" y="478" width="58" height="26" rx="5" fill="#fafafa" stroke="#999999"/>
    <text x="155" y="495" text-anchor="middle" fill="#333333">The</text>
    <rect x="191" y="478" width="58" height="26" rx="5" fill="#fafafa" stroke="#999999"/>
    <text x="220" y="495" text-anchor="middle" fill="#333333">&#160;city</text>
    <rect x="256" y="478" width="58" height="26" rx="5" fill="#fafafa" stroke="#999999"/>
    <text x="285" y="495" text-anchor="middle" fill="#333333">&#160;of</text>
    <rect x="321" y="478" width="58" height="26" rx="5" fill="#fafafa" stroke="#999999"/>
    <text x="350" y="495" text-anchor="middle" fill="#333333">&#160;Q</text>
    <rect x="386" y="478" width="58" height="26" rx="5" fill="#e3edf3" stroke="#2e6f95" stroke-width="1.5"/>
    <text x="415" y="495" text-anchor="middle" fill="#2e6f95">uito</text>
  </g>
  <text x="415" y="522" text-anchor="middle" font-size="11" fill="#2e6f95">final token of the place name</text>

  <!-- caption note -->
  <text x="270" y="548" text-anchor="middle" font-size="11.5" fill="#888888">prompt ends at the name: under causal attention, later tokens could not affect the readout</text>

  <!-- readout tap -->
  <line x1="418" y1="270" x2="553" y2="270" stroke="#2e6f95" stroke-width="2" marker-end="url(#arrblue)"/>
  <text x="495" y="243" text-anchor="middle" font-size="11.5" fill="#2e6f95">residual stream</text>
  <text x="495" y="258" text-anchor="middle" font-size="11.5" fill="#2e6f95">after block &#8467;</text>

  <!-- activation vector -->
  <rect x="556" y="180" width="26" height="180" rx="4" fill="#ffffff" stroke="#2e6f95" stroke-width="1.5"/>
  <g stroke="#9fc0d4" stroke-width="1">
    <line x1="556" y1="210" x2="582" y2="210"/>
    <line x1="556" y1="240" x2="582" y2="240"/>
    <line x1="556" y1="270" x2="582" y2="270"/>
    <line x1="556" y1="300" x2="582" y2="300"/>
    <line x1="556" y1="330" x2="582" y2="330"/>
  </g>
  <text x="563" y="386" text-anchor="middle" font-size="12.5" fill="#2e6f95" font-style="italic">h</text>
  <text x="571" y="390" text-anchor="middle" font-size="9.5" fill="#2e6f95">&#8467;</text>
  <text x="569" y="406" text-anchor="middle" font-size="11" fill="#2e6f95">4096 dims</text>

  <!-- probe -->
  <line x1="585" y1="270" x2="637" y2="270" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="235" width="180" height="70" rx="8" fill="#fdf6ee" stroke="#c98a2b" stroke-width="1.5"/>
  <text x="730" y="262" text-anchor="middle" font-size="13" fill="#333333">ridge regression</text>
  <text x="688" y="286" text-anchor="start" font-size="13" fill="#333333" font-style="italic">&#375; = W h</text>
  <text x="742" y="290" text-anchor="start" font-size="9.5" fill="#333333" font-style="italic">&#8467;</text>
  <text x="750" y="286" text-anchor="start" font-size="13" fill="#333333" font-style="italic">+ b</text>

  <!-- output -->
  <line x1="823" y1="270" x2="867" y2="270" stroke="#444444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="870" y="235" width="96" height="70" rx="8" fill="#ffffff" stroke="#888888"/>
  <text x="918" y="262" text-anchor="middle" font-size="13" fill="#333333" font-style="italic">(lat, lon)</text>
  <text x="918" y="285" text-anchor="middle" font-size="11" fill="#777777">predicted</text>

  <!-- evaluation note -->
  <text x="760" y="340" text-anchor="middle" font-size="11.5" fill="#888888">trained per layer and per template; evaluated on held-out cities</text>
  <text x="760" y="358" text-anchor="middle" font-size="11.5" fill="#888888">by R&#178; and median haversine distance to the true (lat, lon)</text>
</svg>
