<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="marr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
    </marker>
  </defs>

  <!-- panel a -->
  <text x="245" y="34" text-anchor="middle" font-size="13.5" fill="#333333" font-family="Menlo, Consolas, monospace">The city of London</text>
  <text x="245" y="54" text-anchor="middle" font-size="12" fill="#777777">one token, several referents &#8594; readout lands between them</text>
  <rect x="20" y="70" width="450" height="270" rx="8" fill="#fcfcfc" stroke="#cccccc"/>

  <!-- dashed pulls -->
  <g stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 3">
    <line x1="395" y1="130" x2="298" y2="168"/>
    <line x1="120" y1="180" x2="298" y2="168"/>
    <line x1="100" y1="255" x2="298" y2="168"/>
    <line x1="145" y1="290" x2="298" y2="168"/>
  </g>

  <!-- referents (area ~ weight) -->
  <circle cx="395" cy="130" r="17" fill="#2e6f95" fill-opacity="0.85"/>
  <text x="395" y="106" text-anchor="middle" font-size="12" fill="#333333">London, UK</text>
  <circle cx="120" cy="180" r="9" fill="#52a675" fill-opacity="0.85"/>
  <text x="120" y="162" text-anchor="middle" font-size="11" fill="#555555">London, ON</text>
  <circle cx="100" cy="255" r="5.5" fill="#52a675" fill-opacity="0.85"/>
  <text x="100" y="240" text-anchor="middle" font-size="11" fill="#555555">London, KY</text>
  <circle cx="145" cy="290" r="5.5" fill="#52a675" fill-opacity="0.85"/>
  <text x="152" y="311" text-anchor="middle" font-size="11" fill="#555555">London, OH</text>

  <!-- readout -->
  <path d="M 298 156 L 302 165 L 312 166 L 304 172 L 307 182 L 298 176 L 289 182 L 292 172 L 284 166 L 294 165 Z" fill="#d1495b"/>
  <text x="298" y="200" text-anchor="middle" font-size="12" fill="#d1495b" font-style="italic">y&#770; &#8776; &#931; w&#7522; &#956;&#7522;</text>
  <line x1="311" y1="152" x2="381" y2="136" stroke="#d1495b" stroke-width="1.3" marker-end="url(#marr)" marker-start="url(#marr)"/>
  <text x="352" y="120" text-anchor="middle" font-size="11.5" fill="#d1495b">2,490 km</text>
  <text x="245" y="330" text-anchor="middle" font-size="11" fill="#999999">mid-Atlantic</text>

  <!-- panel b -->
  <text x="735" y="34" text-anchor="middle" font-size="13.5" fill="#333333" font-family="Menlo, Consolas, monospace">In United Kingdom, the city of London</text>
  <text x="735" y="54" text-anchor="middle" font-size="12" fill="#777777">preceding context reweights the mixture toward one referent</text>
  <rect x="510" y="70" width="450" height="270" rx="8" fill="#fcfcfc" stroke="#cccccc"/>

  <g stroke="#dddddd" stroke-width="1" stroke-dasharray="4 3">
    <line x1="610" y1="180" x2="852" y2="146"/>
    <line x1="590" y1="255" x2="852" y2="146"/>
    <line x1="635" y1="290" x2="852" y2="146"/>
  </g>

  <circle cx="885" cy="130" r="20" fill="#2e6f95" fill-opacity="0.9"/>
  <text x="885" y="103" text-anchor="middle" font-size="12" fill="#333333">London, UK</text>
  <circle cx="610" cy="180" r="3.5" fill="#52a675" fill-opacity="0.4"/>
  <text x="610" y="166" text-anchor="middle" font-size="11" fill="#aaaaaa">London, ON</text>
  <circle cx="590" cy="255" r="3" fill="#52a675" fill-opacity="0.4"/>
  <circle cx="635" cy="290" r="3" fill="#52a675" fill-opacity="0.4"/>

  <path d="M 852 134 L 856 143 L 866 144 L 858 150 L 861 160 L 852 154 L 843 160 L 846 150 L 838 144 L 848 143 Z" fill="#d1495b"/>
  <text x="843" y="182" text-anchor="middle" font-size="12" fill="#d1495b" font-style="italic">y&#770;</text>
  <line x1="861" y1="139" x2="872" y2="134" stroke="#d1495b" stroke-width="1.3"/>
  <text x="833" y="120" text-anchor="middle" font-size="11.5" fill="#d1495b">1,132 km</text>

  <!-- footer -->
  <text x="490" y="376" text-anchor="middle" font-size="11.5" fill="#888888">circle area &#8733; mixture weight (illustrative, not measured); positions schematic; distances are measured probe errors</text>
  <text x="490" y="396" text-anchor="middle" font-size="11.5" fill="#888888">a linear readout of a weighted mixture of referent representations lands at the weighted mean of their coordinates</text>
</svg>
